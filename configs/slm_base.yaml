# FastFail SLM Base Configuration (~125 M parameters)
model:
  vocab_size: 32000
  max_seq_len: 2048
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  num_kv_heads: 12
  intermediate_size: 3072
  dropout: 0.1
  layer_norm_eps: 1.0e-5
  rope_theta: 10000.0
  tie_embeddings: true

training:
  seed: 42
  mixed_precision: "bf16"
  gradient_checkpointing: true
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  epsilon: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  max_steps: -1
  eval_steps: 500
  save_steps: 1000
  logging_steps: 50
  save_total_limit: 3
  train_split: 0.85
  val_split: 0.10
  test_split: 0.05

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

hpt:
  n_trials: 30
  timeout: 3600
  sampler: "tpe"
  pruner: "hyperband"

export:
  format: "safetensors"
  output_dir: "exported_models"
  quantize: false
